<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>williamAI</title>
<style>
:root{--bg:#0a0b10;--panel:#12141c;--line:#222636;--tx:#e8eaf2;--mut:#8b90a7;--ac:#7c5cff;--ac2:#22d3ee;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;background:radial-gradient(800px 400px at 50% -100px,#2a1f6b55,transparent),var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:800;color:#fff}
header b{font-size:17px;letter-spacing:.3px}header b span{color:var(--ac2)}
.tag{margin-left:auto;font-size:11px;color:var(--mut);border:1px solid var(--line);padding:3px 8px;border-radius:99px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399;margin-right:5px}
#chat{flex:1;overflow-y:auto;padding:16px;max-width:820px;width:100%;margin:0 auto}
.hero{text-align:center;padding:36px 8px 12px}
.hero h1{font-size:34px;margin:0 0 6px;background:linear-gradient(90deg,#fff,var(--ac2) 60%,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:0 auto 18px;max-width:440px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:8px 13px;border-radius:99px;font-size:13px;cursor:pointer}
.chip:active{border-color:var(--ac)}
.m{margin:14px 0;display:flex;gap:10px}
.m.u{justify-content:flex-end}
.b{max-width:88%;padding:10px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
.u .b{background:linear-gradient(135deg,#5b3fe0,#7c5cff);border:0}
.trace{font-size:11px;color:var(--mut);margin-top:6px;font-family:ui-monospace,Menlo,monospace}
pre{background:#07080c;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:8px 0;position:relative;font:12.5px/1.5 ui-monospace,Menlo,monospace}
pre button{position:sticky;float:right;top:0;background:var(--line);color:var(--tx);border:0;border-radius:6px;padding:3px 8px;font-size:11px}
.lang{font-size:10px;color:var(--ac2);text-transform:uppercase}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);max-width:820px;width:100%;margin:0 auto}
input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:12px 14px;border-radius:12px;font-size:16px;outline:0}
input:focus{border-color:var(--ac)}
.send{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;font-weight:700;padding:0 18px;border-radius:12px}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:d 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes d{50%{transform:translateY(-4px);background:var(--ac2)}}
.out{white-space:pre-wrap}.menu{background:0;border:0;color:var(--tx);font-size:20px;padding:0 4px}.fb button{background:0;border:0;color:var(--mut);font-size:14px;padding:2px 6px}#dr{position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-100%);transition:.2s;z-index:5;padding:calc(14px + env(safe-area-inset-top,0px)) 10px 12px;overflow-y:auto}#dr.o{transform:none}#dr button{display:block;width:100%;text-align:left;background:0;border:0;color:var(--tx);padding:9px;border-radius:8px;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#dr button:active{background:var(--line)}</style></head><body>
<header><button class="menu" id="mn">&#9776;</button><div class="logo">W</div><b>william<span>AI</span></b><div class="tag"><i class="dot"></i>WilliamCore v1 · WilliamCore backend online</div></header>
<div id="dr"></div><div id="chat"><div class="hero" id="hero"><h1>williamAI</h1><p>An original AI engine written from scratch. No API keys. No other models. Just William.</p>
<div class="chips" id="chips"></div></div></div>
<form id="f"><input id="q" placeholder="Ask William, or teach him: teach: ping => pong" autocomplete="off"><button class="send">Send</button></form>
<script>
const F='`'.repeat(3);
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let ctx={name:store.get('wai_name'),last:null,turns:0};

const SID=store.get('wai_sid')||(Math.random().toString(36).slice(2)+Date.now().toString(36));store.set('wai_sid',SID);
const OFFLINE={out:'My backend is offline. Start the server with npm start.',skill:'error',conf:0};
/* streams the reply: onDelta(text) fires for each piece when Qwen is answering, resolves with the final {out,skill,conf} */
async function ask(text,onDelta){
 try{
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,sid:SID,stream:true})});
  if(!res.ok||!res.body)return res.ok?OFFLINE:await res.json().catch(()=>OFFLINE);
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',final=null,got=false;
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);if(!ev.startsWith('data:'))continue;
    try{const j=JSON.parse(ev.slice(5));if(j.done)final=j;else if(j.delta){got=true;onDelta(j.delta)}}catch(e){}}}
  if(final)final.streamed=got;return final||OFFLINE;
 }catch(e){return OFFLINE}}
/* ---------- UI ---------- */
const chat=$('#chat');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function render(s){const parts=s.split(F);return parts.map((p,i)=>{if(i%2===0)return esc(p).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
 const nl=p.indexOf('\n'),lang=p.slice(0,nl).trim(),code=p.slice(nl+1).replace(/\n$/,'');
 return '<pre><button onclick="cp(this)">Copy</button>'+(/^(js|javascript)$/.test(lang)?'<button onclick="runJS(this)" style="margin-right:6px">Run</button>':'')+'<div class="lang">'+esc(lang)+'</div><code>'+esc(code)+'</code></pre>'}).join('')}
window.cp=b=>{const t=b.parentNode.querySelector('code').textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='Copied'},()=>{b.textContent='Select + copy'});setTimeout(()=>b.textContent='Copy',1500)};
function add(role,html){const m=document.createElement('div');m.className='m '+(role==='u'?'u':'');m.innerHTML='<div class="b">'+html+'</div>';chat.append(m);chat.scrollTop=chat.scrollHeight;return m.firstChild}
function send(text){text=text.trim();if(!text)return;$('#hero').style.display='none';add('u',esc(text));rec('u',text);
 const b=add('a','<span class="dots"><span></span><span></span><span></span></span>');
 let live='',paint=()=>{let part=live;if((part.split(F).length-1)%2)part+='\n'+F;b.innerHTML=render(part);chat.scrollTop=chat.scrollHeight};
 ask(text,d=>{live+=d;paint()}).then(r=>{rec('a',r.out);let i=0;const full=r.out,step=Math.max(4,Math.ceil(full.length/40));
  if(r.streamed){b.innerHTML=render(full)+'<div class="trace">skill: '+r.skill+' \u00b7 confidence '+Math.round(r.conf*100)+'%</div>';chat.scrollTop=chat.scrollHeight;fbRow(b,text,r);return}
  (function tick(){i=Math.min(full.length,i+step);let part=full.slice(0,i);if((part.split(F).length-1)%2)part+='\n'+F;b.innerHTML=render(part);chat.scrollTop=chat.scrollHeight;
   if(i<full.length)setTimeout(tick,16);else{b.innerHTML=render(full)+'<div class="trace">skill: '+r.skill+' · confidence '+Math.round(r.conf*100)+'%</div>';fbRow(b,text,r)}})()})}
$('#f').onsubmit=e=>{e.preventDefault();const q=$('#q');send(q.value);q.value=''};
['Explain this code:\nfor (x of a) { console.log(x) }','Find bugs:\nif (a = 5) { var x = 1 }','Write binary search in python','Teach: ping => pong','Write fizzbuzz in python','Build a todo app in html','What is 12*(8+3)^2','Make a strong password','Tell me a joke','What can you do?'].forEach(t=>{const c=document.createElement('button');c.className='chip';c.textContent=t;c.onclick=()=>send(t);$('#chips').append(c)});

/* run JS safely in a Worker (in your browser, 3s limit) */
window.runJS=b=>{const pre=b.parentNode,code=pre.querySelector('code').textContent;let out=pre.nextElementSibling;
 if(!out||!out.classList.contains('out')){out=document.createElement('div');out.className='trace out';pre.after(out)}
 out.textContent='Running...';
 const src='const L=[];console.log=(...a)=>L.push(a.map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" "));try{'+code+'\n}catch(e){L.push("Error: "+e.message)}postMessage(L.join("\\n"))';
 let w;try{w=new Worker(URL.createObjectURL(new Blob([src])))}catch(e){out.textContent='Cannot run here';return}
 const to=setTimeout(()=>{w.terminate();out.textContent='Stopped: took longer than 3 seconds'},3000);
 w.onmessage=e=>{clearTimeout(to);out.textContent=e.data||'(no output)';w.terminate()};w.onerror=e=>{clearTimeout(to);out.textContent='Error: '+e.message}};
/* feedback + regenerate */
function fbRow(b,text,r){const d=document.createElement('div');d.className='fb';
 [['\u{1F44D}','up'],['\u{1F44E}','down'],['\u21BB','redo']].forEach(([i,k])=>{const x=document.createElement('button');x.textContent=i;
  x.onclick=()=>{if(k==='redo'){send(text);return}fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:k,text,out:r.out,sid:SID,skill:r.skill})}).catch(()=>{});d.innerHTML='<span class="trace">Thanks, William will learn from that.</span>'};d.append(x)});b.append(d)}
/* chat history sidebar */
let convs=[];try{convs=JSON.parse(store.get('wai_c')||'[]')}catch(e){}
let cur=null;const dr=$('#dr');
function save(){store.set('wai_c',JSON.stringify(convs.slice(0,30)))}
function clearView(){chat.querySelectorAll('.m').forEach(n=>n.remove())}
function newChat(){cur={id:Date.now(),title:'New chat',msgs:[]};clearView();$('#hero').style.display='';dr.classList.remove('o')}
function loadConv(c){cur=c;clearView();$('#hero').style.display='none';c.msgs.forEach(m=>add(m.r,m.r==='u'?esc(m.t):render(m.t)));dr.classList.remove('o')}
function draw(){dr.innerHTML='';const n=document.createElement('button');n.textContent='+ New chat';n.onclick=()=>{newChat();draw()};dr.append(n);
 convs.forEach(c=>{const x=document.createElement('button');x.textContent=c.title;x.onclick=()=>loadConv(c);dr.append(x)})}
function rec(role,t){if(!cur)newChat();if(!convs.includes(cur))convs.unshift(cur);cur.msgs.push({r:role,t:t.slice(0,4000)});if(role==='u'&&cur.title==='New chat')cur.title=t.slice(0,32);save();draw()}
$('#mn').onclick=()=>{draw();dr.classList.toggle('o')};chat.addEventListener('click',()=>dr.classList.remove('o'));draw();
</script></body></html>
